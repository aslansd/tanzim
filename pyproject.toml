[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tanzim"
version = "0.2.0"
description = "Offline-first silent-fault auditor and Measurement & Verification (M&V) engine for building BMS and industrial SCADA logs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Aslan Satary Dizaji", email = "aslansatary@gmail.com" }]
keywords = ["bms", "scada", "hvac", "energy-audit", "fault-detection", "measurement-and-verification", "change-point"]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]
streamlit = ["streamlit>=1.38"]
all = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "streamlit>=1.38"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
tanzim = "tanzim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
